name: Auto Merge Main to Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: List all branches
      run: git branch -a

    - name: Fetch all branches
      run: git fetch origin

    - name: Checkout deployment branch
      run: git checkout deployment

    - name: Merge main into deployment
      run: |
        git merge main --allow-unrelated-histories || true
        git restore --source=HEAD --staged .gitignore || true
        git restore --source=HEAD --staged node_modules/ || true
        git restore --source=HEAD --staged .env || true
        git restore --source=HEAD --staged *.log || true
        git restore --source=HEAD --staged build/ || true
        git restore --source=HEAD --staged README.md || true
        git restore --source=HEAD --staged src/utils || true
        git restore --source=HEAD --staged .ejsbrc.json || true
        git restore --source=HEAD --staged .github/ || true
        git commit -m "Merge main into deployment, excluding specified files" || true
        git push origin deployment
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
